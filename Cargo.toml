[workspace]
resolver = "3"
members = [
    "conway-core", # 공용 라이브러리 (GPU 시뮬레이션, 카메라, 페인팅, UI/튜토리얼, 프리셋)
    "free-mode",   # 1) 자유 모드 + 프리셋 체험
    "challenge",   # 2) 실시간 시뮬레이션 위에서 목표 모양 빠르게 맞추기
    "battle",      # 3) 1 vs 1 대전
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# system_font_discovery: 한글 UI를 위해 시스템 폰트(맑은 고딕, Noto Sans KR 등)를 패밀리 이름으로 사용
bevy = { version = "0.19.1", features = ["system_font_discovery"] }
conway-core = { path = "conway-core" }
